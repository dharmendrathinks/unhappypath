name: Native iOS reference experiments
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: brew install xcodegen
      - run: npm ci --ignore-scripts
      - run: npm run ios:prepare
      - run: npm run ios:demo -- --out runs/native
      # Only export allowlisted evidence. Raw test plans contain ephemeral credentials.
      - if: always()
        run: node scripts/export-suite.mjs runs/native .cache/share-native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-reference-evidence
          path: .cache/share-native
